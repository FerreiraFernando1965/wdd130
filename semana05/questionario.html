<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Questionário </title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>
    <header>
        <h1>WDD 130 | Formulário de Questionário</h1>
    </header>
    <main>
        <form action="#" method="post">


            <label for="q1">1.Quais elementos básicos do HTML?</label>
            <input type="text" id="q1" name="q1">


            <label for="q2">2. Como se conecta o arquivo html ao arquivo css externo?</label>
            <textarea name="q2" id="q2"></textarea>

            <label for="q3">3. Qual é a sequencia correta?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Escolha uma opção!</option>
                <option value="html">html, css, git, github, auditoria</option>
                <option value="class">auditoria, html, css, github, git</option>
                <option value="github">github, auditoria, css, html, git</option>
                <option value="git">html, git, css, auditoria, github</option>
            </select>

            <label for="q4">4. Qual é o erro apresentado na declarção?</label>
            <input type="text" id="q4" name="q4">

            <button type="submit">ENVIAR QUESTIONÁRIO</button>

        </form>
    </main>
    <footer>
        <p>&copy; 2026 🚀 Fernando Luis Ferreira - WDD 130 | QUESTIONÁRIO DE HTML E CSS 🚀
        </p>
    </footer>
</body>

</html>
